[project]
name = "speech-and-text"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diogo Passos Perdigão Britto", email = "diogopbritto@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.2",
    "pyperclip>=1.11.0",
    "python-dotenv==1.2.3",
    "sounddevice>=0.5.6",
    "espeakng-loader>=0.2.4",
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.29.0",
    "qwen-tts>=0.1.1",
    "torch==2.5.1+cu124",
    "torchaudio==2.5.1+cu124",
    "transformers>=4.57.3",
    "setuptools==75.8.2",
]

[project.scripts]
speech-to-text = "speech_to_text:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
