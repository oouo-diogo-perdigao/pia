# Atalhos globais da PIA. Copie para shortcuts.yaml para personalizar
# (o instalador faz essa cópia se o arquivo ainda não existir).
#
# Formato: modificadores+tecla, separados por +.
# Modificadores: ctrl, alt, shift, super (win e meta também valem).
# Deixe o valor vazio para desligar o atalho naquele sistema.
#
# No GNOME estes atalhos do sistema já estão ocupados:
#   ctrl+alt+t  abre o terminal
#   ctrl+alt+d  mostra a área de trabalho
# Por isso os padrões do Linux são outros. No Windows, ctrl+alt+t e ctrl+alt+d seguem livres.

server: http://127.0.0.1:8762
voice: pm_santa
speed: 0.95

shortcuts:
  voice:
    windows: ctrl+alt+p
    linux: ctrl+alt+p
  dictation:
    windows: ctrl+alt+d
    linux: ctrl+alt+shift+d
  speak:
    windows: ctrl+alt+t
    linux: ctrl+alt+shift+t
  storytelling:
    windows: ctrl+alt+l
    linux: ctrl+alt+l
