[project]
name = "image-create-edit"
version = "0.1.0"
description = "OpenAI-compatible image generation and editing gateway for ComfyUI"
readme = "README.md"
authors = [
    { name = "Diogo Passos Perdigão Britto", email = "diogopbritto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.3",
]

[project.scripts]
image-create-edit = "image_create_edit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
