name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3

      - name: Install dependencies
        run: uv sync --python 3.12 --group dev

      - name: Lint with ruff
        run: |
          uv run --no-sync ruff format --check src tests scripts
          uv run --no-sync ruff check src tests scripts

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest tests/ -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/pia/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/pia/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build
