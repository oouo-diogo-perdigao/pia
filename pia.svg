<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <!-- GRADIENTE DO SÍMBOLO: mistura ciano, azul e roxo no anel principal. -->
    <linearGradient id="logoCores" x1="20%" y1="12%" x2="80%" y2="88%">
      <stop offset="0%" stop-color="#25e8ff"/>
      <stop offset="48%" stop-color="#2378ff"/>
      <stop offset="100%" stop-color="#8e2dff"/>
    </linearGradient>

		<!-- CENTRO: deixa o miolo circular escuro, sem depender de formas irregulares. -->
    <radialGradient id="rostoCor" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#071521"/>
      <stop offset="100%" stop-color="#03080f"/>
    </radialGradient>

    <!-- FUNDO: cria a atmosfera escura azulada que destaca os elementos luminosos. -->
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#08162b"/>
      <stop offset="58%" stop-color="#040d1f"/>
      <stop offset="100%" stop-color="#020611"/>
    </radialGradient>

		<!-- OLHO AZUL: gradiente vertical para brilho sem perder a cor base. -->
    <linearGradient id="eyeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43f5ff"/>
      <stop offset="100%" stop-color="#21a8ff"/>
    </linearGradient>

    <!-- OLHO ROXO: equivalente ao olho azul, mas em violeta/magenta. -->
    <linearGradient id="eyePurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d66bff"/>
      <stop offset="100%" stop-color="#7a36ff"/>
    </linearGradient>

		<!-- BRILHO SUAVE: usado nos olhos para simular emissão de luz. -->
		<filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

		<!-- ÓRBITAS: gradiente discreto para as linhas circulares padronizadas. -->
    <linearGradient id="orbitGrad" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#20dfff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#4b63ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c34fff" stop-opacity="0.55"/>
    </linearGradient>

		<!-- GRADIENTE DE SOMBRA TRANSLÚCIDA -->
    <linearGradient id="shadowFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

		<!-- CAUDA ESTRELA 1 (#8ba2ff) -->
    <linearGradient id="tail1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ba2ff" stop-opacity="1.0"/>
      <stop offset="40%" stop-color="#8ba2ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8ba2ff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- CAUDA ESTRELAS 2, 3 e 4 (Tons roxos/magenta) -->
    <linearGradient id="tailPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d860ff" stop-opacity="1.0"/>
      <stop offset="40%" stop-color="#b049ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9748ff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- CAUDA ESTRELA 5 (#ba4dff) -->
    <linearGradient id="tail5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ba4dff" stop-opacity="1.0"/>
      <stop offset="40%" stop-color="#ba4dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ba4dff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- CAUDA ESTRELA 6 (Nova cor ajustada para ciano/azul claro brilhante) -->
    <linearGradient id="tail6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43f5ff" stop-opacity="1.0"/>
      <stop offset="40%" stop-color="#21a8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#21a8ff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- CAUDA ESTRELA 7 (Tons azuis ciano) -->
    <linearGradient id="tailBlueDT" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#20ddff" stop-opacity="1.0"/>
      <stop offset="40%" stop-color="#19cfff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#19cfff" stop-opacity="0.0"/>
    </linearGradient>

		<!-- CAUDA ESTRELA 8 (Tons azuis ciano) -->
    <linearGradient id="tailBlueTD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20ddff" stop-opacity="1.0"/>
      <stop offset="40%" stop-color="#19cfff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#19cfff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- BRILHO AJUSTADO (Um pouco mais intenso, mas suave) -->
    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

	<style>
    @keyframes rotateClockwise {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes rotateAntiClockwise {
      from {
        transform: rotate(360deg);
      }
      to {
        transform: rotate(0deg);
      }
    }
		@keyframes blink {
      0%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(0.1);
      }
    }
		@keyframes lookAround {
      0%, 50%, 100% {
        transform: translateX(0px); /* Olhando para frente (centro) */
      }
      25% {
        transform: translateX(-20px); /* Olha rápido para a esquerda */
      }
      75% {
        transform: translateX(20px);  /* Olha rápido para a direita */
      }
    }
		/* Nova animação de pulsação (estilo caixa de som / zoom in-out) */
    @keyframes soundPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.091);
      }
    }

		/* Nova animação de onda para a fala */
    @keyframes waveTalk {
      1%, 99% {
        opacity: 0.7;
      }
      33% {
        /* Boca bem aberta (área preenchida maior) */
        d: path("M 232 284 Q 250 306 268 284 Q 250 294 232 284 Z");
        opacity: 1;
      }
      66% {
        /* Abertura média da boca */
        d: path("M 233 285 Q 250 299 267 285 Q 250 291 233 285 Z");
        opacity: 0.9;
      }
    }


		.animation-passive-orbit-clockwise {
      /* Ajusta a origem da rotação para o centro exato do SVG (253 256) */
      transform-origin: 250px 250px;
      animation-name: rotateClockwise;
			animation-duration: 3600s;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
			animation-play-state: paused;
			animation-play-state: running;
    }
    .animation-passive-orbit-anti-clockwise {
      /* Ajusta a origem da rotação para o centro exato do SVG (253 256) */
      transform-origin: 250px 250px;
      /* animation: rotateAntiClockwise 60s linear infinite; */
			animation-name: rotateAntiClockwise;
			animation-duration: 60s;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
			animation-play-state: paused;
			animation-play-state: running;
    }

    .animation-orbit-clockwise {
      /* Ajusta a origem da rotação para o centro exato do SVG (253 256) */
      transform-origin: 250px 250px;
      animation-name: rotateClockwise;
			animation-duration: 10s;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
			animation-play-state: paused;
			/* animation-play-state: running; */
    }
    .animation-orbit-anti-clockwise {
      /* Ajusta a origem da rotação para o centro exato do SVG (253 256) */
      transform-origin: 250px 250px;
      /* animation: rotateAntiClockwise 60s linear infinite; */
			animation-name: rotateAntiClockwise;
			animation-duration: 2s;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
			animation-play-state: paused;
			/* animation-play-state: running; */
    }
    .animation-blinking-eyes {
      /* Define o eixo da escala bem no centro horizontal e vertical dos olhos (221 + 20 = 241 no Y) */
      transform-origin: 250px 250px;
      /* animation: blink 600s infinite; */
			animation-name: blink;
			animation-duration: 1.5s;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
			animation-play-state: paused;
			/* animation-play-state: running; */
    }
    .animation-looking-eyes {
      /* Ponto de origem central dos olhos */
      transform-origin: 250px 250px;
      /* animation: lookAround 250s infinite ease-in-out; */
			animation-name: lookAround;
			animation-duration: 3s;
			animation-timing-function: ease-in-out;
			animation-iteration-count: infinite;
			animation-play-state: paused;
			/* animation-play-state: running; */
    }
    .animation-pulse {
      transform-origin: 250px 250px;
      /* animation: soundPulse 0.4s ease-in-out infinite; */
			animation-name: soundPulse;
			animation-duration: 0.8s;
			animation-timing-function: ease-in-out;
			animation-iteration-count: infinite;
			animation-play-state: paused;
			/* animation-play-state: running; */
    }

		.enable-orbits{
			display: block;
			/* display: none; */
		}
		.enable-face{
			display: block;
			/* display: none; */
		}

		.animation-talking {
      animation-name: waveTalk;
      animation-duration: 0.5s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-play-state: paused;
			/* animation-play-state: running; */
    }

    .enable-mouth{
      opacity: 0;
      /* opacity: 1; */
    }

		.enable-bg{
      display: block;
			/* deixa o fundo meio transparente */
			opacity: 0.5;
      /* display: none; */

    }
  </style>

	<!-- FUNDO PRINCIPAL -->
  <circle cx="250" cy="250" r="250" fill="url(#bg)" class="enable-bg"/>

	
	<g class="enable-orbits">
		<!-- ÓRBITAS COMPLETAS -->
		<g fill="none" stroke-linecap="round">
			<circle cx="250" cy="250" r="240" stroke="url(#orbitGrad)" stroke-opacity="0.28" stroke-width="1.8"/>
			<circle cx="250" cy="250" r="220" stroke="url(#orbitGrad)" stroke-opacity="0.14" stroke-width="1.6"/>
			<!-- 60 Traçados -->
			<circle cx="250" cy="250" r="200" stroke="url(#orbitGrad)" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 10.94"/>
		</g>

		<!-- ÓRBITAS PARCIAIS -->
		<g opacity="0.95" fill="none" stroke-linecap="round">
			<!-- GRUPO EM ROTAÇÃO (Estrelas 2, 3, 4 e 7) -->
			<g class="animation-passive-orbit-anti-clockwise">
				<g class="animation-orbit-anti-clockwise">
					<!-- Estrela 2 -->
					<path d="M 445 148.14 A 220 220 0 0 1 450 341.65" stroke="url(#tailPurple)" stroke-width="1.8"/>
					<!-- Estrela 3 -->
					<path d="M 445 351.86 A 220 220 0 0 1 400 410.93" stroke="url(#tailPurple)" stroke-width="1.8"/>
					<!-- Estrela 4 -->
					<path d="M 400 410.93 A 220 220 0 0 1 247 469.98" stroke="url(#tailPurple)" stroke-width="1.8"/>
					<!-- Estrela 7 -->
					<path d="M 56 353.75 A 220 220 0 0 1 77 114.09" stroke="url(#tailBlueDT)" stroke-width="1.8"/>
				</g>
			</g>
	
			<!-- GRUPO EM ROTAÇÃO (Estrelas 1, 5, 6 e 8) -->
			<g class="animation-passive-orbit-clockwise">
				<g class="animation-orbit-clockwise">
					<!-- Estrela 1 -->
					<path d="M 140 36.69 A 240 240 0 0 1 300 15.27" stroke="url(#tail1)" stroke-width="1.8"/>
					<!-- Estrela 5 -->
					<path d="M 247 489.98 A 240 240 0 0 0 347 469.52" stroke="url(#tail5)" stroke-width="2.0"/>
					<!-- Estrela 6 -->
					<path d="M 80 419.41 A 240 240 0 0 0 247 489.98" stroke="url(#tail6)" stroke-width="1.8"/>
					<!-- Estrela 8 -->
					<path d="M 33 147.48 A 240 240 0 0 0 31 348.18" stroke="url(#tailBlueTD)" stroke-width="1.8"/>
				</g>
			</g>
		</g>
	
		<!-- ESTRELAS -->
		<g filter="url(#starGlow)">
			<!-- GRUPO EM ROTAÇÃO (Estrelas 2, 3, 4 e 7) -->
			<g class="animation-passive-orbit-anti-clockwise">
				<g class="animation-orbit-anti-clockwise">
					<!-- Estrela 2 Orbita 2-->
					<circle cx="445" cy="148.14" r="5.3" fill="#d860ff" opacity="1"/>
					<!-- Estrela 3 Orbita 2-->
					<circle cx="445" cy="351.86" r="5.2" fill="#d04fff" opacity="1"/>
					<!-- Estrela 4 Orbita 2-->
					<circle cx="400" cy="410.93" r="4.3" fill="#9748ff" opacity="1"/>
					<!-- Estrela 7 Orbita 2-->
					<circle cx="56" cy="353.75" r="4.8" fill="#20ddff" opacity="1"/>
				</g>
			</g>
	
			<!-- GRUPO EM ROTAÇÃO (Estrelas 1, 5, 6 e 8) -->
			<g class="animation-passive-orbit-clockwise">
				<g class="animation-orbit-clockwise">
					<!-- Estrela 1 Orbita 1-->
					<circle cx="300" cy="15.27" r="5.8" fill="#8ba2ff" opacity="1"/>
					<!-- Estrela 5 Orbita 1-->
					<circle cx="247" cy="489.98" r="4.6" fill="#ba4dff" opacity="1"/>
					<!-- Estrela 6 Orbita 1 (Mudada de branco para ciano/azul brilhante) -->
					<circle cx="80" cy="419.41" r="4.2" fill="#43f5ff" opacity="1"/>
					<!-- Estrela 8 Orbita 1-->
					<circle cx="33" cy="147.48" r="4.8" fill="#19cfff" opacity="1"/>
				</g>
			</g>
		</g>
	</g>
  
	<!-- Corpo Personalizado -->
	<path class="animation-pulse" fill="url(#logoCores)" fill-rule="evenodd"
	d="M 100 410.93 
		L 100 250
		A 150 150 0 1 1 400 250
		A 150 150 0 0 1 180 382.66
		A 40 40 0 0 1 220 329.53
		A 65 65 0 0 1 211 325.52
		A 30 30 0 0 1 185 333
		A 50 50 0 0 1 150 305
		L 150 350
		A 40 60 0 0 1 100 410.93
		Z" />

	<!-- Efeitinho de entrar, meio sombra -->
	<path class="animation-pulse" fill="url(#shadowFade)" filter="url(#eyeGlow)" fill-rule="evenodd"
		d="M 150 286 
			L 173 286
			A 65 65 0 0 0 211 325.52
			A 30 30 0 0 1 185 333
			A 50 50 0 0 1 150 305
			Z" />

	<!-- Rosto -->
	<circle cx="250" cy="250" r="80" fill="url(#rostoCor)" class="animation-pulse"/>

	<g class="enable-face">
		<g class="animation-blinking-eyes">
			<g class="animation-looking-eyes">
				<rect x="210" y="224" width="26" height="40" rx="12" fill="url(#eyePurple)" filter="url(#eyeGlow)"/>
				<rect x="264" y="224" width="26" height="40" rx="12" fill="url(#eyeBlue)" filter="url(#eyeGlow)"/>
			</g>
		</g>
	
		<!-- Boquinha de fala -->
		<path class="animation-talking enable-mouth" fill="url(#logoCores)" stroke="url(#eyeBlue)" stroke-width="1.5"
			stroke-linejoin="round" d="M 234 286 Q 250 290 266 286 Q 250 290 234 286 Z"/>
	</g>
</svg>

<!--
### Guia de Recursos e Parâmetros do Avatar SVG
**Visibilidade e Elementos**
* **`enable-orbits`**: Controla a exibição das órbitas circulares e partículas estelares.
* Padrão: `display: block;`
* Ocultar: `display: none;`

* **`enable-face`**: Controla a exibição do rosto completo (olhos e boca).
* Padrão: `display: block;`
* Ocultar: `display: none;`

* **`enable-mouth`**: Controla a visibilidade da boca.
* Padrão (Visível): `opacity: 1;`
* Ocultar: `opacity: 0;`

### Parâmetros de Velocidade das Animações
Cada animação possui uma classe CSS dedicada. Para alterar a velocidade, ajuste o valor da propriedade `animation-duration` na regra correspondente.
* **Órbitas Externas (Lentas / Sentido Horário)**
* Seletor: `.animation-passive-orbit-clockwise`
* Padrão: `animation-duration: 3600s;`

* **Órbitas Externas (Lentas / Sentido Anti-Horário)**
* Seletor: `.animation-passive-orbit-anti-clockwise`
* Padrão: `animation-duration: 60s;`

* **Órbitas Internas (Rápidas / Sentido Horário)**
* Seletor: `.animation-orbit-clockwise`
* Padrão: `animation-duration: 10s;`

* **Órbitas Internas (Rápidas / Sentido Anti-Horário)**
* Seletor: `.animation-orbit-anti-clockwise`
* Padrão: `animation-duration: 2s;`

* **Piscar dos Olhos**
* Seletor: `.animation-blinking-eyes`
* Padrão: `animation-duration: 1.5s;`

* **Movimento dos Olhos (Olhar para os lados)**
* Seletor: `.animation-looking-eyes`
* Padrão: `animation-duration: 3s;`

* **Pulsação do Corpo e Rosto**
* Seletor: `.animation-pulse`
* Padrão: `animation-duration: 0.8s;`

* **Animação de Fala (Movimento da Boca)**
* Seletor: `.animation-talking`
* Padrão: `animation-duration: 0.5s;`

### Estado de Execução (Play/Pause)
As animações de movimento, piscar, pulsação e fala vêm pausadas por padrão. Para ativá-las, localize
a classe desejada no bloco `<style>` e altere `animation-play-state: paused;` 
para `animation-play-state: running;`.
-->