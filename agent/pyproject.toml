[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diogo Passos Perdigão Britto", email = "diogopbritto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.3",
    "litellm>=1.100.0",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
