[project]
name = "pia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diogo Passos Perdigão Britto", email = "diogopbritto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
		"certifi==2026.7.22",
		"charset-normalizer==3.5.1",
		"colorama==0.4.6",
		"flatbuffers==25.12.19",
		"idna==3.20.0",
		"joblib==1.6.0",
		"mouseinfo==0.1.3",
		"narwhals==2.26.0",
		"numpy>=2.2.0",
		"onnxruntime==1.30.0",
		"sherpa-onnx>=1.13.8",
		"packaging==26.3",
		"pip==26.2.1",
		"protobuf==7.36.2",
		"pyaudio==0.2.14",
		"pyautogui==0.9.54",
		"pygame==2.6.1",
		"pygetwindow==0.0.9",
		"pymsgbox==2.0.1",
		"pyperclip==1.11.0",
		"pyrect==0.2.0",
		"pyscreeze==1.0.1",
		"python-dotenv==1.2.3",
		"pytweening==1.2.0",
		"requests==2.34.2",
		"scikit-learn==1.9.1",
		"scipy==1.16.3",
		"threadpoolctl==3.7.0",
		"tqdm==4.70.1",
		"urllib3==2.8.0",
		"pyqt6>=6.11.0",
		"pyqt6-webengine>=6.11.0",
]

[project.scripts]
pia = "pia:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
