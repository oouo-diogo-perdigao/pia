[project]
name = "text-to-speech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diogo Passos Perdigão Britto", email = "diogopbritto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.3",
    "espeakng-loader>=0.2.4",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "qwen-tts>=0.1.1",
    "sounddevice>=0.5.6",
    "torch==2.5.1+cu121",
		"torchaudio==2.5.1+cu121",
    "transformers>=4.57.3",
]

[project.scripts]
text-to-speech = "text_to_speech:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true