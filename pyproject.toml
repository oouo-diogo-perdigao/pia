[project]
name = "speech-and-text"
version = "0.1.0"
description = "A Personal AI Assistant for Speech, Text and Image Processing"
readme = "README.md"
authors = [
    { name = "Diogo Passos Perdigão Britto", email = "diogopbritto@gmail.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "pyperclip>=1.11.0",
    "python-dotenv==1.2.4",
    "sounddevice>=0.5.6",
    "espeakng-loader>=0.2.4",
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.30.0",
    "qwen-tts>=0.1.1",
    "torch==2.13.0",
    "torchaudio==2.5.1+cu124",
    "transformers>=4.57.3",
    "setuptools==75.8.2",
    "litellm>=1.105.0rc1",
    "google-genai>=1.47.0",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "colorama==0.4.6",
    "flatbuffers==25.12.19",
    "idna==3.20.0",
    "joblib==1.6.0",
    "mouseinfo==0.1.3",
    "narwhals==2.26.0",
    "sherpa-onnx>=1.13.8",
    "packaging==26.3",
    "pip==26.2.1",
    "protobuf==7.36.2",
    "pyaudio==0.2.14",
    "pyautogui==0.9.54",
    "pygetwindow==0.0.9",
    "pymsgbox==2.0.1",
    "pyrect==0.2.0",
    "pyscreeze==1.0.1",
    "pytweening==1.2.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "threadpoolctl==3.7.0",
    "tqdm==4.70.1",
    "urllib3==2.8.0",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
    "watchfiles>=1.3.0",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]

[project.scripts]
pia = "pia:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
