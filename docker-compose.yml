name: pia-base

services:
  comfyui:
    image: yanwk/comfyui-boot:cu126-slim
    container_name: comfyui
    ports:
      - "8188:8188"
    env_file:
      - .env
    environment:
      - CLI_ARGS=--listen 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./cache/comfyui_models:/root/ComfyUI/models/checkpoints
    # command: >
    #   bash -c "
    #   if [ ! -f /home/user/ComfyUI/models/checkpoints/flux1-schnell.safetensors ]; then
    #     echo 'Baixando o modelo FLUX.1 Schnell...' &&
    #     wget --header=\"Authorization: Bearer $$HF_TOKEN\" -O /home/user/ComfyUI/models/checkpoints/flux1-schnell.safetensors https://huggingface.co/black-forest-labs/FLUX.1-schnell/resolve/main/flux1-schnell.safetensors;
    #   fi &&
    #   exec /home/user/venv/bin/python main.py --highvram --listen 0.0.0.0
    #   "
    restart: unless-stopped
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: open-webui
    ports:
      - "4001:8080"
    volumes:
      - ./cache/open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=/ollama
      - WEBUI_SECRET_KEY=sua_chave_secreta_aqui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always